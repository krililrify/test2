<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汇率换算 · 25 种法定货币</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>汇率换算</h1>
    <p class="sub">25 种法定货币 · 数据来自 Frankfurter API</p>
  </header>

  <section class="card controls">
    <label class="field"><span>金额</span>
      <input id="amount" type="text" inputmode="decimal" value="1" autocomplete="off"></label>
    <label class="field"><span>目标货币</span><select id="base"></select></label>
    <button id="swap" class="ghost" type="button" title="与对比货币互换">⇄</button>
    <label class="field"><span>对比货币</span><select id="quote"></select></label>
    <button id="refresh" type="button">刷新汇率</button>
  </section>

  <section class="card summary" id="summary" aria-live="polite"></section>

  <section id="status" class="status" role="status"></section>

  <section class="card">
    <input id="search" type="search" placeholder="搜索货币代码或中文名称，如 USD、日元" autocomplete="off">
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>没有匹配的货币</p>
  </section>

  <footer>汇率仅供参考，实际交易汇率以银行或支付机构为准。</footer>
</main>
<script src="app.js"></script>
</body>
</html>
