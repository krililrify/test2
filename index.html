<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汇率换算 · 25 种法定货币</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<主分支 class="wrap">
  <header>
    <h1>汇率换算</h1>
    <p class="sub">25 种法定货币 · 数据来自 Frankfurter API</p>
  </header>

  <section id="status" class="status" role="status"></section>

  <section class="card">
    <div class="toolbar"><input id="search" type="search" placeholder="搜索货币代码或中文名称，如 USD、日元" autocomplete="off"><button id="refresh" type="button">刷新汇率</button></div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>没有匹配的货币</p>
  </section>

  <footer>汇率仅供参考，实际交易汇率以银行或支付机构为准。</footer>
</主分支>
<script src="app.js"></script>
</body>
</html>
